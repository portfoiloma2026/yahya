<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>يحيى حماتة – اهرب من الزحمة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffc93c;--bg:#0b1024}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#04060d;color:#fff;
  font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;touch-action:none;overscroll-behavior:none}
#stage{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--bg);overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.6)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0;pointer-events:none;z-index:5}
#pills{display:flex;gap:8px}
.pill{background:rgba(8,12,30,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:6px 14px;min-width:78px;text-align:center;line-height:1.1}
.pill small{display:block;font-size:11px;opacity:.75;font-weight:500}
.pill b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.pill.gold b{color:var(--gold)}
#btns{display:flex;gap:8px;pointer-events:auto}
.icon{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:rgba(8,12,30,.62);color:#fff;font-size:18px;cursor:pointer;font-family:inherit}
.icon:active{transform:scale(.92)}
#stage[data-mode=menu] #pills,#stage[data-mode=menu] #btnPause,
#stage[data-mode=over] #btnPause,#stage[data-mode=pause] #btnPause{display:none}

/* toast + hint */
#toast{position:absolute;left:0;right:0;top:24%;text-align:center;font-size:32px;font-weight:900;color:#fff;
  text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(255,200,60,.7);opacity:0;pointer-events:none;z-index:6;padding:0 16px}
#toast.show{animation:toast 1.4s ease-out both}
@keyframes toast{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}
  80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
#hint{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);text-align:center;font-weight:800;
  font-size:15px;background:rgba(8,12,30,.7);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;
  opacity:0;pointer-events:none;z-index:6}
#hint.show{animation:hint 4.5s ease both}
@keyframes hint{0%{opacity:0;transform:translateY(10px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}

/* screens */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:24px;text-align:center;
  background:radial-gradient(ellipse at 50% 30%,rgba(25,40,95,.5),rgba(5,8,22,.88))}
.hide{display:none!important}
h1{margin:0;font-size:clamp(40px,12vw,64px);font-weight:900;line-height:1.05;
  background:linear-gradient(180deg,#fff 20%,#ffd66b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 rgba(0,0,0,.35))}
h2{margin:0;font-size:clamp(22px,7vw,32px);font-weight:800;color:#8fd0ff;letter-spacing:.5px}
#avatar{width:145px;height:145px;border-radius:50%;border:5px solid var(--gold);
  background:radial-gradient(circle at 50% 35%,#4a7bd6,#1a2c66);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}
.best{margin:0;font-size:17px;opacity:.9}
.best b{color:var(--gold)}
.btn{font-family:inherit;font-weight:900;font-size:22px;border:0;border-radius:999px;padding:14px 38px;color:#fff;cursor:pointer;
  min-width:230px;box-shadow:0 7px 0 rgba(0,0,0,.28),0 14px 30px rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.28),0 6px 14px rgba(0,0,0,.35)}
.btn.primary{background:linear-gradient(180deg,#ffd24a,#ff8a1f);color:#3a1e00}
.btn.ghost{background:rgba(255,255,255,.12);font-size:18px;box-shadow:none;border:1px solid rgba(255,255,255,.25);padding:11px 30px}
.links-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.link{font-size:14px;font-weight:800;color:#bfe3ff;cursor:pointer;padding:8px 12px;border-radius:12px;
  background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.3)}
.link.pulse{animation:pulse 1.2s ease-in-out infinite;color:#fff;border-color:var(--gold)}
@keyframes pulse{50%{transform:scale(1.06);background:rgba(255,201,60,.22)}}
.tips{margin:0;font-size:13px;line-height:1.65;opacity:.75}
#photoMsg{margin:0;font-size:13px;color:var(--gold);min-height:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:340px}
.stats div{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:10px 6px}
.stats small{display:block;font-size:12px;opacity:.75}
.stats b{font-size:24px;font-weight:900}
.record{font-weight:900;font-size:20px;color:#3a1e00;background:linear-gradient(180deg,#ffe27a,#ffb02e);padding:6px 18px;border-radius:999px;
  animation:pulse 1s ease-in-out infinite}
</style>
</head>
<body>
<div id="stage" data-mode="menu">
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="pills">
      <div class="pill"><small>السكور</small><b id="score">0</b></div>
      <div class="pill gold"><small>🪙 عملات</small><b id="coins">0</b></div>
    </div>
    <div id="btns">
      <button class="icon" id="btnPause" aria-label="إيقاف مؤقت">⏸</button>
      <button class="icon" id="btnTrack" aria-label="تغيير الأغنية" title="تغيير المهرجان">🎵</button>
      <button class="icon" id="btnMute" aria-label="الصوت">🔊</button>
    </div>
  </div>

  <div id="toast"></div>
  <div id="hint">اسحب ⬅️➡️ للتحرك &nbsp;•&nbsp; ⬆️ نط &nbsp;•&nbsp; ⬇️ انبطح</div>

  <!-- الشاشة الرئيسية -->
  <section id="menu" class="screen">
    <canvas id="avatar" width="300" height="300"></canvas>
    <h1>يحيى حماتة</h1>
    <h2>اهرب من الزحمة</h2>
    <p class="best">أعلى سكور: <b id="bestMenu">0</b></p>
    <button class="btn primary" id="btnStart">يلا نجري! 🏃</button>
    <div class="links-row">
      <label class="link" id="photoLbl">📷 غيّر صورة يحيى<input id="file" type="file" accept="image/*" hidden></label>
      <label class="link" id="audioLbl">🎵 اختار أغاني المهرجان<input id="audioFile" type="file" accept="audio/*" multiple hidden></label>
    </div>
    <p id="photoMsg"></p>
    <p class="tips">اسحب يمين/شمال للتنقل • فوق للنط • تحت للانبطاح<br>كيبورد: الأسهم أو W A S D • زر 🎵 لتبديل المهرجان</p>
  </section>

  <!-- إيقاف مؤقت -->
  <section id="pauseScr" class="screen hide">
    <h1>استراحة ☕</h1>
    <button class="btn primary" id="btnResume">كمّل</button>
    <button class="btn ghost" id="btnHome2">الرئيسية</button>
  </section>

  <!-- نهاية الجولة -->
  <section id="over" class="screen hide">
    <h1 id="overTitle">اووه! 😵</h1>
    <div class="stats">
      <div><small>السكور</small><b id="oScore">0</b></div>
      <div><small>🪙 عملات</small><b id="oCoins">0</b></div>
      <div><small>أعلى سكور</small><b id="oBest">0</b></div>
    </div>
    <div id="record" class="record hide">🏆 رقم قياسي جديد!</div>
    <button class="btn primary" id="btnAgain">العب تاني 🔁</button>
    <button class="btn ghost" id="btnHome">الرئيسية</button>
  </section>
</div>

<script>

/* ---------- أدوات مساعدة ---------- */

function poly(pts, fill) {

  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
